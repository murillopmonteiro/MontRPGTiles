<!doctype html>
<meta charset="utf-8">
<title>Grid mínimo</title>

<!-- Botoes -->
<div>
  <button id="btnPincel">Pincel</button>
  <button id="btnBorracha">Borracha</button>
  <button id="Balde">Balde</button>
</div>
<div>
  <button id="btnRetangulo">Retângulo</button>
  <button id="btnRectClean">Borracha retângulo</button>
  
</div>
<div>
  <button id="Parede">Parede</button>
  <button id="Demolir">Demolir</button>
  <button id="Caixa">Caixa</button>
</div>
<div>
  <input type="color" id="seletorFloor" value="#0000ff">
  <input type="color" id="seletorWall" value='red'>
</div>

<!-- Lousa -->
<canvas id="lousa" width="400" height="400"></canvas>

<!-- Mostra o piso na tela, só para você ver ele mudando -->
<p>Piso: <code id="texto"></code></p>
<p>Paredes: <code id="paredes"></code></p>


<script>
  // Constantes e variáveis globais
const TAM = 25;                
const COLUNAS = 16, LINHAS = 16;

const floor = Array.from({ length: LINHAS }, () => Array(COLUNAS).fill(false)); 
const Xwall = Array.from({ length: LINHAS }, () => Array(COLUNAS + 1).fill(false));
const Ywall = Array.from({ length: LINHAS + 1 }, () => Array(COLUNAS).fill(false));

let RectStart = null;

const lousa = document.getElementById("lousa");
const pincel = lousa.getContext("2d");  //caneta q desenha na lousa

let color = "#0000ff"; // cor inicial do pincel
let WallMaterial = 'red'
let tool = "pincel";

//Botoes de ferramentas
document.getElementById("btnPincel").addEventListener("click", function() {
  tool = "pincel";
});
document.getElementById("btnBorracha").addEventListener("click", function() {
  tool = "borracha";  
});
document.getElementById("btnRetangulo").addEventListener("click", function() {
  tool = "retangulo";
});
document.getElementById("seletorFloor").addEventListener("input", function() {
  color = this.value;
});
document.getElementById("seletorWall").addEventListener("input", function() {
  WallMaterial = this.value;
})
document.getElementById("btnRectClean").addEventListener("click", function() {
  tool = "borracha retangulo";
}); 
document.getElementById("Balde").addEventListener("click", function() {
  tool = "balde";
});
document.getElementById("Parede").addEventListener("click", function() {
  tool = "parede";
});
document.getElementById("Demolir").addEventListener("click", function(){
  tool = "demolir"
});
document.getElementById("Caixa").addEventListener("click", function(){
  tool = "caixa"
});

//funcoes base

function desenhar() {
  // apaga a lousa inteira
  pincel.clearRect(0, 0, lousa.width, lousa.height);
  pincel.strokeStyle = "black";
  pincel.lineWidth = 1

  // redesenha casa por casa, olhando o piso
  for (let y = 0; y < LINHAS; y++) {
    for (let x = 0; x < COLUNAS; x++) {
      const corDaCasa = floor[y][x];
      pincel.fillStyle = corDaCasa || "white";
      pincel.fillRect(x * TAM, y * TAM, TAM, TAM);     // preenche a casa
      pincel.strokeRect(x * TAM, y * TAM, TAM, TAM);   // contorno do grid
    }
  }

  // desenha as paredes

  pincel.lineWidth = 4
  
  for (let y = 0; y < LINHAS; y++) {
    for (let x = 0; x < COLUNAS + 1; x++) {
      if (Xwall[y][x] != false) {
        pincel.strokeStyle = Xwall[y][x]
        pincel.beginPath();
        pincel.moveTo(x * TAM, y * TAM);
        pincel.lineTo(x * TAM, (y+1) * TAM);
        pincel.stroke();
      }
    }
  } 
  for (let y = 0; y < LINHAS + 1; y++) {
    for (let x = 0; x < COLUNAS; x++) {
      if (Ywall[y][x]) {
        pincel.strokeStyle = Ywall[y][x]
        pincel.beginPath();
        pincel.moveTo(x * TAM, y * TAM);
        pincel.lineTo((x+1) * TAM, y * TAM);
        pincel.stroke();
      } 
    }
  }

  document.getElementById("texto").textContent = JSON.stringify(floor);
  document.getElementById("paredes").textContent = `\nXwall:\n${JSON.stringify(Xwall)}, Ywall:\n${JSON.stringify(Ywall)}`;
}
     

function look(evento){
  const px = evento.offsetX;
  const py = evento.offsetY;
  const x = Math.floor(px / TAM);
  const y = Math.floor(py / TAM);
  return [x, y];
}

function lookWall(evento){
  // Determina se a parede é vertical ou horizontal
  const px = evento.offsetX;
  const fx = px / TAM;
  let wx = 0; 
  if (Math.abs(Math.ceil(fx) - fx) > Math.abs(fx - Math.floor(fx))) {
    wx = Math.abs(fx - Math.floor(fx));
  } else {
    wx = Math.abs(Math.ceil(fx) - fx);
  }
  const py = evento.offsetY;
  const fy = py / TAM;
  let wy = 0;
  if (Math.abs(Math.ceil(fy) - fy) > Math.abs(fy - Math.floor(fy))) {
    wy = Math.abs(fy - Math.floor(fy));
  } else {
    wy = Math.abs(Math.ceil(fy) - fy);
  } // Adiciona no array de paredes, dependendo se é vertical ou horizontal
  if (wx < wy) {
    return ['x', Math.floor(fy), Math.round(fx)];
  } else {
    return ['y', Math.round(fy), Math.floor(fx)];
  }
}

function balde(evento){
  const corAlvo = floor[y][x];
      if (corAlvo === color){
        return;
      } else {
        const stack = [[x, y]];
        while (stack.length > 0) {
          const [cx, cy] = stack.pop();
          if (cx < 0 || cx >= COLUNAS || cy < 0 || cy >= LINHAS) {
            continue; 
          }
          if (floor[cy][cx] === corAlvo) {
            floor[cy][cx] = color;
            if (Ywall[cy][cx] === false){
              stack.push([cx + 1, cy]);
            }
            stack.push([cx - 1, cy]);
            stack.push([cx, cy + 1]);
            stack.push([cx, cy - 1]);
          }
        }
      }
}


//Ferramentas
function aplicar_ferramenta(evento){
  const [x, y] = look(evento);
  if (tool === "pincel"){
    floor[y][x] = color;
  } else if (tool === "borracha") {
    floor[y][x] = false;
  } else if (tool === "balde") {
    // VOLTAR AQUI
      const corAlvo = floor[y][x];
      if (corAlvo === color){
        return;
      } else {
        const stack = [[x, y]];
        while (stack.length > 0) {
          const [cx, cy] = stack.pop();
          if (cx < 0 || cx >= COLUNAS || cy < 0 || cy >= LINHAS) {
            continue; 
          }
          if (floor[cy][cx] === corAlvo) {
            floor[cy][cx] = color;
            if (Ywall[cy][cx - 1] === false){
              stack.push([cx + 1, cy]);
            }
            if (Ywall[cy][cx] === false) {
              stack.push([cx - 1, cy]);
            }
            if (Xwall[cy - 1][cx] === false){
               stack.push([cx, cy + 1])
            }
            if (Xwall[cy][cx] === false){
               stack.push([cx, cy - 1])
            }
          }
        }
      }
  } else if (tool === "parede") {
    i = lookWall(evento);
    if (i[0] === 'x'){
      Xwall[i[1]][i[2]] = WallMaterial;
    } else if (i[0] === 'y'){
      Ywall[i[1]][i[2]] = WallMaterial;
    }
  } else if (tool === "demolir") {
    i = lookWall(evento);
    if (i[0] === 'x'){
      Xwall[i[1]][i[2]] = false;
    } else if (i[0] === 'y'){
      Ywall[i[1]][i[2]] = false;
    }
  }
}

function desenhar_retangulo(start, end) {
  const x1 = start[0];
  const y1 = start[1];
  const x2 = end[0];
  const y2 = end[1];
  for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      if (tool === "borracha retangulo") {
        floor[y][x] = false;
      } else { 
        floor[y][x] = color;
      }
    } 
  }
}

function desenhar_retangulo_preview(start, end) {
  pincel.lineWidth = 1
  pincel.strokeStyle = 'black'
  const x1 = start[0];
  const y1 = start[1];
  const x2 = end[0];
  const y2 = end[1];
  for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      if (tool === "borracha retangulo") {
        pincel.fillStyle = "white";
      } else { 
        pincel.fillStyle = color;
      }
      pincel.fillRect(x * TAM, y * TAM, TAM, TAM);
      pincel.strokeRect(x * TAM, y * TAM, TAM, TAM);
    } 
  }
}

function desenharCaixa(start, end){
  const x1 = Math.min(start[0], end[0]);
  const y1 = Math.min(start[1], end[1]);
  const x2 = Math.max(start[0], end[0]);
  const y2 = Math.max(start[1], end[1]);
  for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
    Xwall[y][x1] = WallMaterial;
  }
   for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
    Xwall[y][x2+1] = WallMaterial;
  }
   for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
    Ywall[y1][x] = WallMaterial;
  }
   for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
    Ywall[y2+1][x] = WallMaterial;
  }
  desenhar_retangulo(start, end);
}


//Eventos do mouse  
lousa.addEventListener("mousedown", function (evento) {
  if (tool === "retangulo" || tool === "borracha retangulo" || tool == "caixa") {
    RectStart = look(evento);
  } else {
    aplicar_ferramenta(evento);
    desenhar();
  }
});

lousa.addEventListener("mousemove", function (evento) {
  if (evento.buttons === 1 && (tool === "pincel" || tool === "borracha" || tool === "parede" || tool === "demolir")) {
    aplicar_ferramenta(evento);
    desenhar();
  }
  if (RectStart != null) {
    desenhar_retangulo_preview(RectStart, look(evento));
    if (evento.buttons !== 1) {
      RectStart = null;
      desenhar();
    } 
  }
});

lousa.addEventListener("mouseup", function (evento) {
  if ((tool === "retangulo" || tool === "borracha retangulo") && RectStart != null) {   // só pinta se o retângulo começou dentro da lousa
    desenhar_retangulo(RectStart, look(evento));
    RectStart = null;
    desenhar();
  } else if ((tool === "caixa")  && RectStart != null) {
    desenharCaixa(RectStart, look(evento));
    RectStart = null;
  }
    desenhar();
});

desenhar();

</script>

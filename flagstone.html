<title>Flagstone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#141217; --panel:#1d1a21; --panel2:#27232c; --panel3:#312c37;
  --line:#3a3440; --text:#ece5d8; --muted:#a2998b; --faint:#6f6874;
  --accent:#d4a24c; --accent-ink:#1b1408; --danger:#d0583f;
  --display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:60px minmax(0,1fr) 292px;grid-template-rows:auto minmax(0,1fr)}
/* top bar */
.bar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.04em;color:var(--accent);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:22px;height:22px}
.mapname{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;font-size:16px;font-weight:500;min-width:0;width:220px}
.mapname:hover{border-color:var(--line)}
.mapname:focus{outline:none;border-color:var(--accent);background:var(--panel2)}
.dims{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.grp{display:flex;align-items:center;gap:4px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--panel3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{padding:6px 7px}
.btn svg{width:17px;height:17px}
.btn.danger{color:#f0a896}
.zoomv{font-family:var(--mono);font-size:12px;width:46px;text-align:center;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;overflow-y:auto}
.rail .sep{width:28px;height:1px;background:var(--line);margin:5px 0}
.tool{position:relative;width:44px;height:40px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.tool svg{width:21px;height:21px}
.tool:hover{background:var(--panel2);color:var(--text)}
.tool.on{background:var(--panel3);border-color:var(--accent);color:var(--accent)}
.tool kbd{position:absolute;right:3px;bottom:1px;font-family:var(--mono);font-size:9px;color:var(--faint)}
.tool.on kbd{color:var(--accent)}
/* stage */
.stage{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%, #1c1920, #0f0d12)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap}
.chip{background:rgba(20,18,23,.86);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-family:var(--mono);font-size:12px;color:var(--text)}
.chip b{color:var(--accent);font-weight:600}
/* panel */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:18px}
.panel h2{font-family:var(--display);font-size:20px;font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:700}
.hint{color:var(--muted);font-size:14px;line-height:1.45;margin:4px 0 0}
.hint kbd,.keys kbd{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--text)}
.sw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sw{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:4px 2px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.sw canvas,.sw img{width:44px;height:44px;border-radius:4px;display:block;object-fit:cover;background:var(--panel3)}
.panel input[type=range]{width:100%;accent-color:var(--accent)}
.fstatus{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;border:1px solid}
.pill.ok{color:#9fd38a;border-color:#4d6b43;background:#1f2a1c}
.pill.warn{color:#f0c878;border-color:#6b5a33;background:#2a2418}
.maplist{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto}
.mapitem{display:flex;gap:10px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.mapitem.on{border-color:var(--accent)}
.mapitem img,.mapitem .nothumb{width:72px;height:54px;object-fit:cover;border-radius:4px;flex:none;background:var(--panel3)}
.mapitem .mi{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.mapitem .mi b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapitem .mi>span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.mapitem .btn{padding:3px 9px;font-size:13px}
.wallnow{display:flex;gap:10px;align-items:center;font-size:14px}
.wallnow canvas{width:44px;height:44px;border-radius:4px;flex:none}
.hint code{font-family:var(--mono);font-size:11px;word-break:break-all}
.search{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;color:var(--text);font-size:14.5px;width:100%}
.search:focus{outline:none;border-color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--panel3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.dropzone{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:14px;background:rgba(20,18,23,.82);display:grid;place-items:center;z-index:40;pointer-events:none}
.dropzone[hidden]{display:none}
.dropzone div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:16px}
.dropzone strong{font-family:var(--display);font-size:26px;color:var(--accent)}
.dropzone span{color:var(--muted)}
.sw span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.sw:hover{border-color:var(--faint);color:var(--text)}
.sw.on{border-color:var(--accent);color:var(--accent);background:var(--panel3)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:5px;padding:5px 6px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--text);font-size:14.5px;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.colors{display:flex;flex-wrap:wrap;gap:6px}
.colors button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.colors button.on{border-color:var(--text)}
.tlist{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow-y:auto}
.titem{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:14px}
.titem:hover{background:var(--panel2)}
.titem.on{background:var(--panel3)}
.titem .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--ring,#000)}
.titem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .meta{font-family:var(--mono);font-size:11px;color:var(--faint)}
.titem .x{border:0;background:transparent;color:var(--faint);cursor:pointer;padding:0 4px;font-size:16px;line-height:1}
.titem .x:hover{color:var(--danger)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.divider{height:1px;background:var(--line);margin:2px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;color:var(--muted);align-items:center}
.empty{font-size:13.5px;color:var(--faint);font-style:italic}
/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--panel3);border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(8,6,10,.75);display:grid;place-items:center;z-index:30;padding:16px}
.modal .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:min(900px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal img{max-width:100%;border-radius:4px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
/* narrow */
@media (max-width: 860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 64vh auto}
  .rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:6px 16px;justify-content:flex-start}
  .rail .sep{width:1px;height:26px;margin:0 4px;flex:none}
  .tool{flex:none}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .mapname{width:150px}
  .hide-sm{display:none}
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand" aria-label="Flagstone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/></svg>
      Flagstone
    </div>
    <input id="mapName" class="mapname" aria-label="Map name" spellcheck="false">
    <span class="dims" id="dims"></span>
    <span class="spacer"></span>
    <div class="grp">
      <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
    <div class="grp">
      <button class="btn icon" id="zoomOut" title="Zoom out (-)" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <span class="zoomv" id="zoomV">100%</span>
      <button class="btn icon" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button>
      <button class="btn" id="fitBtn" title="Fit map to screen (0)">Fit</button>
    </div>
    <div class="grp">
      <button class="btn" id="mapTabBtn" title="New, save and open maps (N)">Maps</button>
      <button class="btn primary" id="exportBtn" title="Export the map as a PNG image">Export PNG</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
      <input type="file" id="dirIn" webkitdirectory directory multiple hidden>
      <input type="file" id="imgIn" accept="image/jpeg,image/png,image/webp" multiple hidden>
      <input type="file" id="wallDirIn" webkitdirectory directory multiple hidden>
      <input type="file" id="propDirIn" webkitdirectory directory multiple hidden>
      <input type="file" id="doorDirIn" webkitdirectory directory multiple hidden>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Tools"></nav>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Battle map canvas"></canvas>
    <div class="hud"><span class="chip" id="hudCell">—</span><span class="chip" id="hudInfo"></span></div>
  </main>

  <aside class="panel" id="panel"></aside>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="dropzone" id="dropZone" hidden><div><strong>Drop to import textures</strong><span>Folders keep their subfolders as categories</span></div></div>

<script>
(() => {
"use strict";
let TS = 64;                    // terrain texture px per square (set per map size)
const FT = 5;                   // feet per square
const $ = id => document.getElementById(id);

/* ---------- helpers ---------- */
function rng(a, b, k) {
  let n = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(k | 0, 1442695041);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function shade(hex, amt){ // amt -1..1
  const [r,g,b]=hexRgb(hex); const f=v=>Math.max(0,Math.min(255,Math.round(amt<0? v*(1+amt) : v+(255-v)*amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function lum(hex){ const [r,g,b]=hexRgb(hex); return (0.299*r+0.587*g+0.114*b)/255; }
function colName(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let uid = Date.now() % 100000;
const newId = () => 'i' + (uid++).toString(36);
function circle(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); }
function ellipse(c,x,y,rx,ry){ c.beginPath(); c.ellipse(x,y,rx,ry,0,0,Math.PI*2); c.fill(); }

/* ---------- terrain ---------- */
const WET = new Set([7,8]);
const TERRAIN = [
  { key:'grass', name:'Grass', draw(c,s,r){
      c.fillStyle=shade('#5a7a39',(r(1)-.5)*.1); c.fillRect(0,0,s,s);
      for(let i=0;i<9;i++){ const x=r(10+i)*s, y=r(30+i)*s, l=s*(.06+r(50+i)*.07);
        c.strokeStyle= r(70+i)>.5 ? 'rgba(130,165,80,.7)' : 'rgba(55,80,35,.7)'; c.lineWidth=s*.025;
        c.beginPath(); c.moveTo(x,y); c.lineTo(x-l*.4,y-l); c.moveTo(x,y); c.lineTo(x+l*.3,y-l*.9); c.stroke(); }
  }},
  { key:'dirt', name:'Dirt', draw(c,s,r){
      c.fillStyle=shade('#77583a',(r(1)-.5)*.1); c.fillRect(0,0,s,s);
      for(let i=0;i<14;i++){ c.fillStyle= r(40+i)>.5?'rgba(150,115,80,.55)':'rgba(60,42,25,.5)'; circle(c,r(i)*s,r(20+i)*s,s*(.015+r(60+i)*.03)); }
  }},
  { key:'sand', name:'Sand', draw(c,s,r){
      c.fillStyle=shade('#cdb27b',(r(1)-.5)*.06); c.fillRect(0,0,s,s);
      c.strokeStyle='rgba(160,130,80,.45)'; c.lineWidth=s*.02;
      for(let i=0;i<3;i++){ const y=(i+.3+r(5+i)*.4)*s/3; c.beginPath(); c.moveTo(0,y); c.quadraticCurveTo(s*.5,y+s*.07*(r(9+i)-.5)*2,s,y); c.stroke(); }
      for(let i=0;i<10;i++){ c.fillStyle='rgba(120,95,55,.35)'; circle(c,r(20+i)*s,r(40+i)*s,s*.012); }
  }},
  { key:'snow', name:'Snow', draw(c,s,r){
      c.fillStyle='#e4eaee'; c.fillRect(0,0,s,s);
      for(let i=0;i<4;i++){ c.fillStyle='rgba(150,175,200,.22)'; ellipse(c,r(i)*s,r(10+i)*s,s*(.12+r(20+i)*.15),s*(.05+r(30+i)*.06)); }
      for(let i=0;i<6;i++){ c.fillStyle='rgba(255,255,255,.9)'; circle(c,r(40+i)*s,r(50+i)*s,s*.015); }
  }},
  { key:'stone', name:'Flagstone', draw(c,s,r){
      c.fillStyle='#3d3a38'; c.fillRect(0,0,s,s);
      const g=s*.035, tone=(r(1)-.5)*.16;
      c.fillStyle=shade('#8b8680',tone); c.fillRect(g,g,s-2*g,s-2*g);
      c.fillStyle='rgba(255,255,255,.08)'; c.fillRect(g,g,s-2*g,s*.05);
      c.fillStyle='rgba(0,0,0,.12)'; c.fillRect(g,s-g-s*.05,s-2*g,s*.05);
      if(r(2)>.6){ c.strokeStyle='rgba(40,38,36,.55)'; c.lineWidth=s*.018; c.beginPath(); const x=r(3)*s;
        c.moveTo(x,g); c.lineTo(x+(r(4)-.5)*s*.3,s*.45); c.lineTo(x+(r(5)-.5)*s*.4,s*.7); c.stroke(); }
      for(let i=0;i<5;i++){ c.fillStyle='rgba(60,56,52,.35)'; circle(c,g+r(10+i)*(s-2*g),g+r(20+i)*(s-2*g),s*.015); }
  }},
  { key:'cobble', name:'Cobbles', draw(c,s,r){
      c.fillStyle='#403b36'; c.fillRect(0,0,s,s);
      const n=3; for(let j=0;j<n;j++)for(let i=0;i<n;i++){ const k=j*n+i;
        const cx=(i+.5+(r(10+k)-.5)*.25)*s/n, cy=(j+.5+(r(30+k)-.5)*.25)*s/n;
        c.fillStyle=shade('#8a8177',(r(50+k)-.5)*.25); ellipse(c,cx,cy,s/n*.42,s/n*.38);
        c.fillStyle='rgba(255,255,255,.1)'; ellipse(c,cx-s*.02,cy-s*.03,s/n*.25,s/n*.16); }
  }},
  { key:'wood', name:'Planks', draw(c,s,r){
      const n=4, ph=s/n;
      for(let i=0;i<n;i++){ c.fillStyle=shade('#8a6139',(r(5+i)-.5)*.22); c.fillRect(0,i*ph,s,ph);
        c.strokeStyle='rgba(60,38,20,.35)'; c.lineWidth=s*.012; c.beginPath();
        c.moveTo(0,i*ph+ph*(.35+r(15+i)*.3)); c.bezierCurveTo(s*.3,i*ph+ph*.3,s*.6,i*ph+ph*.7,s,i*ph+ph*(.35+r(25+i)*.3)); c.stroke();
        if(r(35+i)>.5){ c.fillStyle='rgba(40,25,12,.8)'; c.fillRect(r(45+i)*s,i*ph,s*.02,ph); } }
      c.fillStyle='rgba(35,22,10,.85)'; for(let i=0;i<=n;i++) c.fillRect(0,i*ph-s*.01,s,s*.02);
  }},
  { key:'water', name:'Water', draw(c,s,r,same){
      c.fillStyle='#3a6d8c'; c.fillRect(0,0,s,s);
      c.strokeStyle='rgba(170,210,230,.35)'; c.lineWidth=s*.025; c.lineCap='round';
      for(let i=0;i<3;i++){ const x=r(i)*s*.7+s*.1, y=r(10+i)*s*.8+s*.1, w=s*(.12+r(20+i)*.12);
        c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+w/2,y-s*.05,x+w,y); c.stroke(); }
      foam(c,s,same,'rgba(215,235,240,.55)');
  }},
  { key:'deep', name:'Deep water', draw(c,s,r,same){
      c.fillStyle='#22455d'; c.fillRect(0,0,s,s);
      c.strokeStyle='rgba(120,170,200,.25)'; c.lineWidth=s*.025; c.lineCap='round';
      for(let i=0;i<2;i++){ const x=r(i)*s*.6+s*.1, y=r(10+i)*s*.8+s*.1, w=s*(.15+r(20+i)*.15);
        c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+w/2,y-s*.06,x+w,y); c.stroke(); }
      foam(c,s,same,'rgba(215,235,240,.5)');
  }},

function itemFor(key){ if(key.startsWith('lib:') && LIB.has(key)) return {key,lib:true}; const i=TERRAIN.findIndex(t=>t.key===key); return i>=0 && !(TERRAIN[i].tex&&TERRAIN[i].tex.lib) ? {key,idx:i} : null; }
function gridItems(){
  const q=cur.q.trim().toLowerCase(), base=TERRAIN.map((t,i)=>({t,i})).filter(x=>!(x.t.tex&&x.t.tex.lib));
  const byName=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true});
  if(q){ const words=q.split(/\s+/), hit=s=>words.every(w=>s.includes(w));
    const a=base.filter(x=>hit((x.t.name+' '+x.t.group).toLowerCase())).map(x=>({key:x.t.key,idx:x.i}));
    for(const m of [...LIB.values()].sort(byName)) if(hit((m.name+' '+m.cat+' '+m.group+' '+m.file).toLowerCase())) a.push({key:m.key,lib:true});
    return a; }
  if(cur.cat==='painted') return base.filter(x=>x.t.group==='Painted').map(x=>({key:x.t.key,idx:x.i}));

  if(cur.cat.startsWith('lib:')){ const id=cur.cat.slice(4); return [...LIB.values()].filter(m=>m.catId===id).sort(byName).map(m=>({key:m.key,lib:true})); }

}

  else if(act==='confirmDelLocal'){ deleteLocal(b.dataset.id); }
  else if(act==='createMap'){ const w=clamp(+$('newW').value||24,4,120), h=clamp(+$('newH').value||18,4,120), g=$('newGround').value;
    settings.newW=w; settings.newH=h; settings.newGround=g;
    pushUndo(); map=blankMap(w,h,TI(g)); sel=null; rebuildTerrain(); fit(); afterChange(true);
    toast(`New ${w}×${h} map — Ctrl+Z brings the previous one back`); }
  else if(act==='saveFile'){ saveToFile(); }
  else if(act==='openFile'){ $('fileIn').click(); }
  else if(act==='exportPng'){ exportPNG(); }
  else if(act==='importDir'){ $('dirIn').click(); }
  else if(act==='importImgs'){ $('imgIn').click(); }
  else if(act==='importWalls'){ $('wallDirIn').click(); }
  else if(act==='importDoors'){ $('doorDirIn').click(); }
  else if(act==='restyleDoors'){ pushUndo(); const d=curDoorData(); for(const [k,v] of Object.entries(map.doors)){ v.s=d.s; v.f=d.f; }
    const W=map.w; map.hw.forEach((v,i)=>{ if(v===2){ const k=doorKey('h',i%W,Math.floor(i/W)); if(!map.doors[k]) map.doors[k]={...d}; } });
    map.vw.forEach((v,i)=>{ if(v===2){ const k=doorKey('v',i%(W+1),Math.floor(i/(W+1))); if(!map.doors[k]) map.doors[k]={...d}; } });
    afterChange(); toast('All doors restyled'); }
  else if(act==='delDoors'){ $('doorDelRow').innerHTML=`<button class="btn danger" data-act="confirmDelDoors">Delete ${DLIB.size} door pieces</button><button class="btn" data-act="cancel">Cancel</button>`; }
  else if(act==='confirmDelDoors'){ const keys=[...DLIB.keys()]; doorDelete(keys).then(()=>{ settings.doorRecent=[]; if(keys.includes(settings.doorStyle)) settings.doorStyle='inc:wood_dark_a'; if(keys.includes(settings.doorFrame)) settings.doorFrame='inc:stone_earthy_a'; settings.doorCat='inc'; renderPanel(); draw(); toast(`Removed ${keys.length} door pieces`); }); }
  else if(act==='restyleAll'){ pushUndo(); const wi=curWallIdx(); map.hws=map.hws.map((v,i)=>map.hw[i]?wi:v); map.vws=map.vws.map((v,i)=>map.vw[i]?wi:v); afterChange(); toast('All walls restyled'); }
  else if(act==='delWallCat'){ const id=settings.wallCat.slice(4), n=[...WLIB.values()].filter(m=>m.catId===id).length;
    $('wallDelRow').innerHTML=`<span class="hint" style="margin:0;width:100%">Delete these ${n} wall styles from this browser? Walls already built with them turn back into drawn walls.</span><button class="btn danger" data-act="confirmDelWallCat">Delete ${n}</button><button class="btn" data-act="cancel">Cancel</button>`; }
  else if(act==='confirmDelWallCat'){ const id=settings.wallCat.slice(4), keys=[...WLIB.values()].filter(m=>m.catId===id).map(m=>m.key);
    wallDelete(keys).then(()=>{ for(const k of keys){ const st=WALLSTYLES.get(k); if(st){ st.loaded=false; st.imgs={}; st.missing=true; } }
      settings.wallRecent=(settings.wallRecent||[]).filter(k=>!keys.includes(k)); if(keys.includes(settings.wallStyle)) settings.wallStyle='inc:stone_a/earthy';
      settings.wallCat='inc:Stone'; renderPanel(); draw(); toast(`Removed ${keys.length} wall styles`); }); }
  else if(act==='cancelImport'){ if(importing){ importing.cancel=true; b.disabled=true; b.textContent='Stopping…'; } }
  else if(act==='delCat'){ const id=cur.cat.slice(4), n=[...LIB.values()].filter(m=>m.catId===id).length;
    $('libDelRow').innerHTML=`<span class="hint" style="margin:0;width:100%">Delete these ${n} textures from this browser? Floors already painted with them turn to flat colour.</span><button class="btn danger" data-act="confirmDelCat">Delete ${n}</button><button class="btn" data-act="cancel">Cancel</button>`; }
  else if(act==='confirmDelCat'){ const id=cur.cat.slice(4), keys=[...LIB.values()].filter(m=>m.catId===id).map(m=>m.key);
    libDelete(keys).then(()=>{ settings.recent=(settings.recent||[]).filter(k=>!keys.includes(k)); cur.cat='painted'; renderPanel(); toast(`Removed ${keys.length} textures`); }); }
});
panel.addEventListener('input',e=>{ const id=e.target.id, v=e.target.value;
  if(id==='newW'||id==='newH'){ const w=clamp(+$('newW').value||0,0,120), h=clamp(+$('newH').value||0,0,120); $('newSize').textContent=`${w*FT} × ${h*FT} ft. The current map stays in the undo history.`; }
  if(id==='terrQ'){ cur.q=v; fillTerrGrid(); } if(id==='wallQ'){ settings.wallQ=v; fillWallGrid(); } if(id==='propQ'){ settings.propQ=v; fillPropGrid(); }
  if(id==='edRotR'||id==='edScaleR'){ const o=findSel(); if(!o||sel.type!=='prop') return;
    if(!e.target.dataset.pushed){ pushUndo(); e.target.dataset.pushed=1; }
    if(id==='edRotR'){ o.rot=+v; $('edRot').value=v; } else { o.scale=+v/100; $('edScale').value=v; } draw(); } });
panel.addEventListener('change',e=>{ const id=e.target.id, v=e.target.value;
  if(id==='terrCat'){ cur.cat=v; cur.q=''; autosave(); renderPanel(); }
  if(id==='wallCat'){ settings.wallCat=v; settings.wallQ=''; autosave(); renderPanel(); }
  if(id==='propCat'){ settings.propCat=v; settings.propQ=''; autosave(); renderPanel(); }
  if(id==='doorCat'){ settings.doorCat=v; autosave(); renderPanel(); }
  if(id==='fileName'){ pushUndo(); map.name=v.trim()||'Untitled map'; afterChange(true); }
  if(id==='doorFrame'){ settings.doorFrame=v; doorStyleFor(v,true); autosave(); }
  if(id==='curRot'){ cur.rot=normDeg(+v||0); draw(); }
  if(id==='curScale'){ cur.scale=clamp((+v||100)/100,.1,10); draw(); }
  if(id==='curFlip'){ cur.flip=e.target.checked; draw(); }
  if(id==='optRandom'){ settings.propRandom=e.target.checked; autosave(); }
  if(id==='optSnap'){ settings.propSnap=e.target.checked; autosave(); }
  if(id==='edRot'||id==='edScale'){ const o=findSel(); if(o && sel.type==='prop'){ pushUndo(); if(id==='edRot') o.rot=normDeg(+v||0); else o.scale=clamp((+v||100)/100,.1,10); afterChange(true); } }
  if(id==='edRotR'||id==='edScaleR'){ afterChange(true); } });
$('doorDirIn').addEventListener('change',e=>{ const l=filesFromInput(e.target); e.target.value=''; if(l.length) importDoors(l); });
$('propDirIn').addEventListener('change',e=>{ const l=filesFromInput(e.target); e.target.value=''; if(l.length) importProps(l); });
$('wallDirIn').addEventListener('change',e=>{ const l=filesFromInput(e.target); e.target.value=''; if(l.length) importWalls(l); });
function filesFromInput(input){ return [...input.files].map(f=>({file:f,path:f.webkitRelativePath||f.name})); }
$('dirIn').addEventListener('change',e=>{ const l=filesFromInput(e.target); e.target.value=''; if(l.length) importFiles(l); });
$('imgIn').addEventListener('change',e=>{ const l=filesFromInput(e.target); e.target.value=''; if(l.length) importFiles(l); });
// drag a folder (or images) anywhere onto the page
let dragDepth=0;
const hasFiles=e=>e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('dropZone').hidden=false; });
window.addEventListener('dragover',e=>{ if(hasFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; if(--dragDepth<=0){ dragDepth=0; $('dropZone').hidden=true; } });
window.addEventListener('drop',e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth=0; $('dropZone').hidden=true;
  const items=[...e.dataTransfer.items], files=[...e.dataTransfer.files];
  if(files.length===1 && /\.json$/i.test(files[0].name)){ openMapFile(files[0]); return; }
  const entries=items.map(i=>i.webkitGetAsEntry ? i.webkitGetAsEntry() : null).filter(Boolean);
  const into = tool==='wall' ? importWalls : tool==='door' ? importDoors : tool==='prop' ? importProps : importFiles;
  (entries.length ? entriesToFiles(entries) : Promise.resolve(files.map(f=>({file:f,path:f.name})))).then(l=>into(l)); });
function confirmRow(kind){ $('newRow').innerHTML=`<span class="hint" style="margin:0;width:100%">${kind==='new'?'Clear everything and start over?':'Replace this map with the example?'} You can undo this.</span><button class="btn danger" data-act="${kind==='new'?'confirmNew':'confirmSample'}">${kind==='new'?'Clear map':'Load example'}</button><button class="btn" data-act="cancel">Cancel</button>`; }
panel.addEventListener('click',e=>{ const it=e.target.closest('[data-tok]'); if(!it||e.target.closest('button')) return; const t=map.tokens.find(o=>o.id===it.dataset.tok); if(!t) return;
  if(tool!=='select') setTool('select'); sel={type:'token',id:t.id}; const n=sizeOf(t).n; view.ox=cw/2-(t.x+n/2)*view.s; view.oy=ch/2-(t.y+n/2)*view.s; renderPanel(); draw(); });
panel.addEventListener('input',e=>{ const id=e.target.id;
  if(id==='tkName'){ cur.token.name=e.target.value; const hint=e.target.closest('.stack').querySelector('.hint b'); if(hint) hint.textContent=nextTokenName(cur.token.name); draw(); }
  if(id==='edName'){ const o=findSel(); if(o){ if(!e.target.dataset.pushed){ pushUndo(); e.target.dataset.pushed=1; } o.name=e.target.value||'?'; autosave(); draw(); } }
});
panel.addEventListener('change',e=>{ const id=e.target.id, v=e.target.value;
  if(id==='tkKind'){ cur.token.kind=v; if(v==='hero'&&cur.token.name==='Goblin'){ cur.token.name='Hero'; } renderPanel(); }
  else if(id==='tkSize'){ cur.token.size=+v; }
  else if(id==='edKind'||id==='edSize'){ const o=findSel(); if(o){ pushUndo(); if(id==='edKind') o.kind=v; else { o.size=+v; const n=sizeOf(o).n; o.x=clamp(o.x,0,map.w-n); o.y=clamp(o.y,0,map.h-n); } afterChange(); } }
  else if(id==='edName'){ renderPanel(); }
  else if(id==='optGrid'){ settings.grid=e.target.checked; autosave(); draw(); }
  else if(id==='optNames'){ settings.names=e.target.checked; autosave(); draw(); }
});

/* top bar */
$('mapName').addEventListener('change',e=>{ pushUndo(); map.name=e.target.value.trim()||'Untitled map'; afterChange(); });
$('undoBtn').onclick=undo; $('redoBtn').onclick=redo;
$('zoomIn').onclick=()=>zoomAt(cw/2,ch/2,1.25); $('zoomOut').onclick=()=>zoomAt(cw/2,ch/2,.8); $('fitBtn').onclick=fit;
const fileBase=()=> (map.name||'battle-map').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()||'battle-map';
let dlPromise=null;
function getDownloads(){ if(!dlPromise) dlPromise = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null); return dlPromise; }
async function offer(filename,data,fallback){
  const dl=await getDownloads();
  if(!dl){ fallback(); return; }
  try{ await dl.save({filename,data}); toast('Saved '+filename); }
  catch(err){ const c=err&&err.code; if(c==='declined') toast('Save cancelled'); else if(c==='rate_limited') toast('A save prompt is already open'); else fallback(); }
}
$('exportBtn').onclick=()=>exportPNG();
$('mapTabBtn').onclick=()=>setTool('file');
function exportPNG(){
  const s=settings.exportPx||100, c=document.createElement('canvas'); c.width=map.w*s; c.height=map.h*s; const x=c.getContext('2d');
  drawScene(x,s,{export:true});
  c.toBlob(blob=>{ offer(fileBase()+'.png',blob,()=>showImage(c.toDataURL('image/png'))); },'image/png');
};
// the file carries the map plus the display settings that affect how it looks
const FILE_SETTINGS=['grid','names','diag','fogView','exportPx'];
function saveToFile(){ const o=JSON.parse(serialize()); o.settings=Object.fromEntries(FILE_SETTINGS.map(k=>[k,settings[k]])); const data=JSON.stringify(o);
  offer(fileBase()+'.flagstone.json',data,()=>{ try{ navigator.clipboard.writeText(data).then(()=>toast('Saving files isn’t available here — map JSON copied to clipboard'),()=>toast('Saving files isn’t available in this view')); }catch(e){ toast('Saving files isn’t available in this view'); } }); }
$('fileIn').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) openMapFile(f); };
async function openMapFile(f){
  try{ const o=JSON.parse(await f.text()); const snap=serialize(); loadMapObj(o); if(o.settings) for(const k of FILE_SETTINGS) if(k in o.settings) settings[k]=o.settings[k]; undoStack.push(snap); redoStack.length=0; sel=null; rebuildTerrain(); fit(); afterChange(true); toast('Opened '+map.name); }
  catch(err){ toast('That file isn’t a Flagstone map (.json)'); } };
function showImage(url){ const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card"><div class="row" style="align-items:center"><strong style="font-family:var(--display);font-size:18px">Your map image</strong><button class="btn" style="flex:none">Close</button></div><p class="hint" style="margin:0">Right-click (or long-press) the image and choose “Save image”.</p><img alt="Exported battle map" src="${url}"></div>`;
  m.addEventListener('click',e=>{ if(e.target===m||e.target.closest('button')) m.remove(); }); document.body.appendChild(m); }

/* ---------- boot ---------- */
function resize(){ const r=stage.getBoundingClientRect(); dpr=window.devicePixelRatio||1; const first=!cw; cw=r.width; ch=r.height; cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); if(first) fit(); else draw(); }
function boot(){
  let loaded=false;
  try{ const s=localStorage.getItem('flagstone.map'); if(s){ loadMapObj(JSON.parse(s)); loaded=true; } const st=localStorage.getItem('flagstone.settings'); if(st) Object.assign(settings,JSON.parse(st)); }catch(e){}
  if(!loaded) map=sampleMap();
  buildRail(); rebuildTerrain(); loadTextures(); setTool('select'); updateDims(); updateUndo(); libInit();
  new ResizeObserver(resize).observe(stage); resize();
  if(document.fonts) document.fonts.ready.then(draw);
  getDownloads();
}
boot();
})();
</script>
